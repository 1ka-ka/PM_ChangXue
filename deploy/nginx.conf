# 畅学社区 MVP 生产配置（S12 交付文档任务③：静态 + /api 反代 + /uploads 直出）
# 用法：软链或复制到 /etc/nginx/conf.d/changxue.conf，重载 nginx

server {
    listen 80;
    server_name your-domain.com;  # TODO: 替换为实际域名/IP

    # 前端静态产物（frontend npm run build → dist）
    root /opt/changxue/frontend/dist;
    index index.html;

    # 前端 history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代（uvicorn 127.0.0.1:8000，多 worker 由 systemd/supervisor 管理）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件直出（头像/帖子图片，uvicorn StaticFiles 之外由 nginx 直出提效）
    location /uploads/ {
        alias /opt/changxue/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 上传体积限制（发帖配图）
    client_max_body_size 5m;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
